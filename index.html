<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord des commandes</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- En-tête -->
    <header class="page-header py-4">
        <div class="container">
            <h1 class="fw-bold mb-1">Tableau de bord des commandes</h1>
            <p class="text-muted mb-0">Gestion des clients, produits et commandes</p>
        </div>
    </header>

    <!-- Contenu principal -->
    <main class="container py-5">

        <!-- Zone d'erreur -->
        <div id="errorMessage" class="alert alert-danger d-none" role="alert">
            Impossible de charger les données.
        </div>

        <!-- Indicateurs (grille 2x2 sur mobile avec col-6 col-md-3) -->
        <section class="row g-3 mb-5">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <p class="text-muted mb-1">Clients</p>
                    <h2 id="totalCustomers" class="h3 mb-0"></h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <p class="text-muted mb-1">Produits</p>
                    <h2 id="totalProducts" class="h3 mb-0"></h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <p class="text-muted mb-1">Commandes</p>
                    <h2 id="totalOrders" class="h3 mb-0"></h2>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <p class="text-muted mb-1">Montant total</p>
                    <h2 id="totalAmount" class="h3 mb-0"></h2>
                </div>
            </div>
        </section>

        <!-- Barre de filtres -->
        <section class="row g-3 mb-4">
            <div class="col-md-4">
                <label for="searchInput" class="form-label fw-semibold">Rechercher</label>
                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    placeholder="Nom du client..."
                >
            </div>

            <div class="col-md-4">
                <label for="statusSelect" class="form-label fw-semibold">Statut</label>
                <select id="statusSelect" class="form-select">
                    <option value="">Tous</option>
                    <option value="Livree">Livrée</option>
                    <option value="En attente">En attente</option>
                    <option value="Annulee">Annulée</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="categorySelect" class="form-label fw-semibold">Catégorie</label>
                <select id="categorySelect" class="form-select">
                    <option value="">Tous</option>
                </select>
            </div>
        </section>

        <!-- Compteur de résultats -->
        <p id="resultCount" class="text-muted"></p>

        <!-- Zone des commandes -->
        <section class="table-responsive">
            <table class="table align-middle bg-white">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Client</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Paiement</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                </tbody>
            </table>
        </section>

    </main>

    <!-- Modal Bootstrap vide (modal-lg) pour le détail d'une commande -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle" class="modal-title fs-5"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div id="modalBody" class="modal-body">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Application -->
    <script type="module" src="js/app.js"></script>

</body>

</html>
